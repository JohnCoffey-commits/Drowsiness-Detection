name: Goal 3 delivery checks

on:
  push:
    branches: [learning/reproducible-delivery]
  pull_request:
    branches: [codex/visionguard-github-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal3-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend behavior and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install pip==26.3 setuptools==84.2.1
      - run: python -m pip install -r requirements/dev.txt
      - run: bash scripts/check.sh backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: reports/
          retention-days: 14

  frontend:
    name: Frontend lint types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: SystemUI/package-lock.json
      - run: npm --prefix SystemUI ci
      - run: bash scripts/check.sh frontend

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: SystemUI/package-lock.json
      - run: python -m pip install pip==26.3 setuptools==84.2.1
      - run: python -m pip install -r requirements/dev.txt
      - run: npm --prefix SystemUI ci --ignore-scripts
      - run: bash scripts/check.sh audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-reports
          path: reports/
          retention-days: 14
